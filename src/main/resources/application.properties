# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.thymeleaf.cache=false
spring.main.show-banner=false
# Shared Redis for temporary HTTP idempotency (fixed 60-second TTL).
spring.data.redis.host=${CIA_REDIS_HOST:localhost}
spring.data.redis.port=${CIA_REDIS_PORT:6379}
spring.data.redis.username=${CIA_REDIS_USERNAME:}
spring.data.redis.password=${CIA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${CIA_REDIS_SSL:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# CIA-API and Kafka configuration (secrets are injected at runtime)
spring.application.name=${SPRING_APPLICATION_NAME:cia-api}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.username=${KAFKA_USERNAME}
kafka.password=${KAFKA_PASSWORD}
kafka.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
kafka.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/ca.crt}

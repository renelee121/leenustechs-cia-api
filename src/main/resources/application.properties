# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG
# Persistent development ledger; use a shared PostgreSQL datasource in production.
spring.datasource.url=${CIA_DATABASE_URL:jdbc:h2:file:./data/cia-api}
spring.datasource.username=${CIA_DATABASE_USERNAME:sa}
spring.datasource.password=${CIA_DATABASE_PASSWORD:}
spring.sql.init.mode=always

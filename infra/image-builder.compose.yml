# Proyecto Hostinger: platform-jenkins-image-builder
# El agente se une a Jenkins y a la red privada del Registry.
services:
  docker-agent:
    image: leenustechs/jenkins-build-agent:buildctl-1
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      JENKINS_URL: "http://controller:8080/"
      JENKINS_AGENT_NAME: "docker-build-01"
      JENKINS_SECRET: "REEMPLAZAR_SECRET_NODO_JENKINS"
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: "/home/jenkins/agent"
      BUILDKIT_HOST: "tcp://buildkitd:1234"
    volumes:
      - agent_work:/home/jenkins/agent
    networks:
      - jenkins_ci
      - ci_registry
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  buildkitd:
    image: moby/buildkit:rootless
    restart: unless-stopped
    command:
      - "--addr"
      - "tcp://0.0.0.0:1234"
      - "--oci-worker-no-process-sandbox"
      - "--config"
      - "/etc/buildkit/buildkitd.toml"
    configs:
      - source: buildkit_config
        target: /etc/buildkit/buildkitd.toml
    security_opt:
      - "seccomp=unconfined"
      - "apparmor=unconfined"
    expose:
      - "1234"
    networks:
      - ci_registry
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
    cpus: 2
    mem_limit: 4g
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  buildkit_config:
    content: |
      [registry."registry:5000"]
        http = true

networks:
  jenkins_ci:
    external: true
    name: platform-jenkins_ci
  ci_registry:
    external: true
    name: platform_ci_registry

volumes:
  agent_work:
    name: platform_jenkins_build_agent_work
  buildkit_cache:
    name: platform_ci_buildkit_cache

# Proyecto Hostinger: platform-registry
# Registry solo en la red privada; no publica puertos del VPS.
services:
  registry:
    image: registry:3
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: "/var/lib/registry"
      REGISTRY_AUTH: "htpasswd"
      REGISTRY_AUTH_HTPASSWD_REALM: "LeenusTechs Internal Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: "/auth/htpasswd"
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/auth:ro
    networks:
      ci_registry:
        aliases:
          - registry
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ci_registry:
    external: true
    name: platform_ci_registry

volumes:
  registry_data:
    name: platform_registry_data
  registry_auth:
    external: true
    name: platform_registry_auth
